<style>
:root{

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(135deg,#0f3d4f 0%,#155e75 60%,#1b7a94 100%);color:#fff;padding:14px 20px 12px;flex-shrink:0}
header h1{font-size:19px;font-weight:700;letter-spacing:.02em}
header p{font-size:12px;opacity:.85;margin-top:3px}
#layout{display:flex;flex:1;min-height:0}
#sidebar{width:340px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#filters{padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfaf7}
.flabel{font-size:11px;font-weight:700;color:var(--sub);margin:6px 0 4px;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none;transition:all .12s;color:var(--ink)}
.chip:hover{border-color:#94a3b8}
.chip.on{color:#fff;border-color:transparent}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
#count{font-size:11px;color:var(--sub);margin-top:8px}
#list{flex:1;overflow-y:auto;padding:8px}
.item{background:#fff;border:1px solid var(--line);border-left:4px solid var(--sub);border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:box-shadow .12s}
.item:hover{box-shadow:0 2px 8px rgba(0,0,0,.10)}
.item h3{font-size:13px;font-weight:700;line-height:1.35}
.item .meta{font-size:11px;color:var(--sub);margin-top:3px}
.badge{display:inline-block;font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:1px 6px;margin-right:4px;vertical-align:1px}
#map{flex:1;min-width:0}
.leaflet-popup-content{font-family:inherit;font-size:12.5px;line-height:1.55;margin:12px 14px;max-width:260px}
.pop h3{font-size:14px;margin-bottom:4px;line-height:1.35}
.pop .desc{margin:6px 0}
.pop .adr{color:var(--sub);font-size:11.5px}
.pop .links{margin-top:7px;display:flex;gap:10px}
.pop a{color:var(--sea);font-weight:700;text-decoration:none;font-size:12px}
.pop a:hover{text-decoration:underline}
#note{font-size:10.5px;color:var(--sub);padding:7px 14px;border-top:1px solid var(--line);background:#fbfaf7;flex-shrink:0}
.marker-pin{border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:22px;height:22px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.marker-pin span{transform:rotate(45deg);display:block;color:#fff;font-size:11px;text-align:center;line-height:18px;font-weight:700}
#tilewarn{display:none;position:absolute;top:10px;right:10px;z-index:1000;background:#fff8e1;border:1px solid #f0d060;border-radius:6px;padding:6px 10px;font-size:11px;max-width:220px}
@media (max-width:760px){
  #layout{flex-direction:column}
  #sidebar{width:100%;height:45%;border-right:none;border-top:1px solid var(--line);order:2}
  #map{height:55%;order:1}
}
</style>
</head>

{name:"ペリー記念館・ペリー公園",cat:"史跡・ゆかりの地",pref:"神奈川県",addr:"横須賀市久里浜7-14",sta:"京急久里浜駅",lat:35.2266,lng:139.7160,desc:"1853年ペリー艦隊上陸の地。ペリー来航に始まる日米和親条約で伊豆・下田が開港しており、下田開国史とつながる史跡。入館無料。",url:"https://www.city.yokosuka.kanagawa.jp/5560/sisetu/fc00000442.html",type:"spot"},
{name:"台場公園(第三台場)",cat:"史跡・ゆかりの地",pref:"東京都",addr:"港区台場1-10-1",sta:"お台場海浜公園駅",lat:35.6383,lng:139.7728,desc:"幕末に伊豆・韮山代官の江川英龍(韮山反射炉の建設者)が設計・築造を指揮した品川台場の遺構。国指定史跡。",url:"https://www.kissport.or.jp/spot/tanbou/1905/",type:"spot"},
{name:"宝戒寺",cat:"史跡・ゆかりの地",pref:"神奈川県",addr:"鎌倉市小町3-5-22",sta:"鎌倉駅",lat:35.3218,lng:139.5577,desc:"伊豆(韮山)発祥の北条氏の執権屋敷跡に建ち、北条一族の菩提を弔う寺。「萩の寺」としても有名。",url:"https://hokaiji.com/",type:"spot"},
{name:"法華堂跡(源頼朝墓・北条義時墓)",cat:"史跡・ゆかりの地",pref:"神奈川県",addr:"鎌倉市西御門2丁目",sta:"鎌倉駅",lat:35.3262,lng:139.5603,desc:"伊豆配流から挙兵した源頼朝と、伊豆出身の北条義時の墓所。国指定史跡・日本遺産構成文化財。",url:"https://www.city.kamakura.kanagawa.jp/treasury/hokkedo.html",type:"spot"},
{name:"覚園寺",cat:"史跡・ゆかりの地",pref:"神奈川県",addr:"鎌倉市二階堂421",sta:"鎌倉駅(バス「大塔宮」下車)",lat:35.3346,lng:139.5651,desc:"伊豆出身の北条義時が建立した大倉薬師堂を前身とする寺院。義時ゆかりの薬師堂や黒地蔵で知られる。",url:"https://kamakura894do.com/",type:"spot"},
{name:"寿福寺(北条政子墓)",cat:"史跡・ゆかりの地",pref:"神奈川県",addr:"鎌倉市扇ガ谷1-17-7",sta:"鎌倉駅",lat:35.3253,lng:139.5498,desc:"鎌倉五山第三位。伊豆の豪族・北条時政の娘、北条政子(尼将軍)のやぐら墓がある。",url:"https://www.jalan.net/kankou/spt_14204aj2200023501/",type:"spot"},
{name:"早雲寺",cat:"史跡・ゆかりの地",pref:"神奈川県",addr:"足柄下郡箱根町湯本405",sta:"箱根湯本駅",lat:35.2286,lng:139.1035,desc:"伊豆・韮山城を本拠に伊豆一国を平定した北条早雲(伊勢宗瑞)と小田原北条五代の菩提寺。五代の墓所がある。",url:"https://www.kintouzan-souunji.jp/",type:"spot"},
{name:"石橋山古戦場・佐奈田霊社",cat:"史跡・ゆかりの地",pref:"神奈川県",addr:"小田原市石橋",sta:"早川駅・根府川駅",lat:35.2210,lng:139.1380,desc:"伊豆で挙兵した源頼朝が1180年に大敗した石橋山合戦の古戦場。伊豆から始まる頼朝旗揚げの史跡。",url:"https://www.city.odawara.kanagawa.jp/kanko/spot/isibasiyama.html",type:"spot"},
{name:"皇居東御苑(江戸城跡・伊豆石の石垣)",cat:"その他",pref:"東京都",addr:"千代田区千代田1-1",sta:"大手町駅",lat:35.6864,lng:139.7563,desc:"江戸城の石垣には伊豆半島東海岸で切り出された「伊豆石」が大量に使われた。無料公開の東御苑でその石垣を間近に見られる。",url:"https://www.city.ito.shizuoka.jp/gyosei/soshikikarasagasu/shogaigakushuka/bunka_supotsu/2/2/1/2425.html",type:"spot"},
{name:"伊豆箱根鉄道 大雄山線(大雄山駅)",cat:"その他",pref:"神奈川県",addr:"南足柄市関本(大雄山駅) ※起点は小田原駅",sta:"小田原駅〜大雄山駅",lat:35.3210,lng:139.1080,desc:"伊豆で駿豆線(三島〜修善寺)を運行する伊豆箱根鉄道が神奈川県内で運行する路線。首都圏側で「いずっぱこ」に日常的に乗れる。",url:"https://www.izuhakone.co.jp/railway/",type:"spot"}
];


const CAT_COLORS = {
  "金目鯛・地魚":"#c2410c",
  "干物・郷土料理":"#a16207",
  "わさび":"#4d7c0f",
  "伊豆諸島(参考)":"#0e7490",
  "アンテナショップ・物販":"#7c3aed",
  "史跡・ゆかりの地":"#9f1239",
  "その他":"#475569"
};
const CAT_ICONS = {
  "金目鯛・地魚":"魚","干物・郷土料理":"干","わさび":"山","伊豆諸島(参考)":"島",
  "アンテナショップ・物販":"店","史跡・ゆかりの地":"史","その他":"他"
};
const PREFS = ["東京都","神奈川県","埼玉県"];
const CATS = Object.keys(CAT_COLORS);

const state = { prefs:new Set(PREFS), cats:new Set(CATS) };

const map = L.map('map',{zoomControl:true}).setView([35.55,139.55],9);
let tileFailed=false;
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
tiles.on('tileerror',()=>{ if(!tileFailed){tileFailed=true;document.getElementById('tilewarn').style.display='block';} });
tiles.on('tileload',()=>{ document.getElementById('tilewarn').style.display='none'; });

function gmapUrl(s){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' '+s.pref+s.addr); }

function makeIcon(cat){
  const c = CAT_COLORS[cat]||'#475569';
  return L.divIcon({
    className:'',
    html:`<div class="marker-pin" style="background:${c}"><span>${CAT_ICONS[cat]||'・'}</span></div>`,
    iconSize:[22,22], iconAnchor:[11,22], popupAnchor:[0,-24]
  });
}

const markers = SPOTS.map(s=>{
  const m = L.marker([s.lat,s.lng],{icon:makeIcon(s.cat)});
  m.bindPopup(`<div class="pop">
    <span class="badge" style="background:${CAT_COLORS[s.cat]}">${s.cat}</span><span class="badge" style="background:#94a3b8">${s.pref}</span>
    <h3>${s.name}</h3>
    <div class="desc">${s.desc}</div>
    <div class="adr">📍 ${s.pref}${s.addr}<br>🚉 ${s.sta}</div>
    <div class="links"><a href="${gmapUrl(s)}" target="_blank" rel="noopener">Googleマップ</a><a href="${s.url}" target="_blank" rel="noopener">詳細ページ</a></div>
  </div>`);
  s._marker = m;
  return m;
});

function chip(label,color,set,key,onChange){
  const el = document.createElement('div');
  el.className='chip on';
  el.innerHTML = color?`<span class="dot" style="background:${color}"></span>${label}`:label;
  el.style.background = color||'#155e75'; el.style.color='#fff';
  el.onclick = ()=>{
    if(set.has(key)){set.delete(key);el.classList.remove('on');el.style.background='#fff';el.style.color='var(--ink)';}
    else{set.add(key);el.classList.add('on');el.style.background=color||'#155e75';el.style.color='#fff';}
    onChange();
  };
  return el;
}

function visible(s){ return state.prefs.has(s.pref) && state.cats.has(s.cat); }

function refresh(){
  let n=0;
  const list = document.getElementById('list');
  list.innerHTML='';
  SPOTS.forEach(s=>{
    if(visible(s)){
      n++;
      if(!map.hasLayer(s._marker)) s._marker.addTo(map);
      const it = document.createElement('div');
      it.className='item';
      it.style.borderLeftColor = CAT_COLORS[s.cat];
      it.innerHTML = `<h3>${s.name}</h3><div class="meta"><span class="badge" style="background:${CAT_COLORS[s.cat]}">${s.cat}</span>${s.pref}・${s.sta}</div>`;
      it.onclick = ()=>{ map.flyTo([s.lat,s.lng],14,{duration:.6}); s._marker.openPopup(); };
      list.appendChild(it);
    } else {
      if(map.hasLayer(s._marker)) map.removeLayer(s._marker);
    }
  });
  document.getElementById('count').textContent = `表示中: ${n} / ${SPOTS.length} 件`;
}

const pc = document.getElementById('prefChips');
PREFS.forEach(p=>pc.appendChild(chip(p,null,state.prefs,p,refresh)));
const cc = document.getElementById('catChips');
CATS.forEach(c=>cc.appendChild(chip(c,CAT_COLORS[c],state.cats,c,refresh)));

refresh();
map.fitBounds(L.latLngBounds(SPOTS.map(s=>[s.lat,s.lng])).pad(0.06));
</script>
</body>
</html>
